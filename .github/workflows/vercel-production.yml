# Автодеплой в Vercel Production при каждом push в основную ветку.
#
# Настройка (один раз):
# 1. Vercel → Project → Settings → Git: подключите репозиторий (тогда деплой часто уже идёт сам).
#    Этот workflow дублирует явный `vercel deploy --prod` из CI.
# 2. GitHub → Repo → Settings → Secrets and variables → Actions, добавьте:
#    - VERCEL_TOKEN   (Vercel → Account Settings → Tokens)
#    - VERCEL_ORG_ID  (из .vercel/project.json после `vercel link` или Team Settings)
#    - VERCEL_PROJECT_ID
#
# Получить ORG_ID и PROJECT_ID локально: npx vercel link && cat .vercel/project.json

name: Vercel Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy to Vercel Production
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
